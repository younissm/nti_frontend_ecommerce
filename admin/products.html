<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <main class="projects-page">
        <header class="projects-header">
            <div>
                <h1>Products</h1>
                <p>Add, update, and remove store products.</p>
            </div>
            <nav class="projects-actions">
                <a class="projects-button projects-button-secondary" href="categories.html">Categories</a>
                <a class="projects-button projects-button-secondary" href="users.html">Users</a>
                <a class="projects-button projects-button-secondary" href="orders.html">Orders</a>
                <button id="logout" class="projects-button" type="button">Logout</button>
            </nav>
        </header>

        <form id="product-form" class="admin-form">
            <input id="product-id" type="hidden">
            <h2 id="product-form-title">Add product</h2>
            <div class="admin-form-grid">
                <div class="field">
                    <label for="product-name">Name</label>
                    <input id="product-name" name="name" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="product-category">Category</label>
                    <select id="product-category" name="categoryId" required></select>
                </div>
                <div class="field admin-form-wide">
                    <label for="product-image">Product image</label>
                    <input id="product-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
                    <small>PNG, JPEG, WebP, or GIF. Maximum 1 MB. The image is saved in your browser.</small>
                    <img id="product-image-preview" class="admin-product-image-preview" alt="Product image preview" hidden>
                </div>
                <div class="field">
                    <label for="product-price">Price</label>
                    <input id="product-price" name="price" type="number" min="0.01" step="0.01" required>
                </div>
                <div class="field">
                    <label for="product-stock">Available stock</label>
                    <input id="product-stock" name="stockQuantity" type="number" min="0" step="1" required>
                </div>
                <div class="field admin-form-wide">
                    <label for="product-description">Description</label>
                    <textarea id="product-description" name="description" rows="3" maxlength="500" required></textarea>
                </div>
            </div>
            <p id="product-message" class="form-message" role="alert" aria-live="polite" hidden></p>
            <button id="product-submit" class="submit-button" type="submit">Add product</button>
            <button id="product-cancel" class="projects-button projects-button-secondary" type="button" hidden>Cancel edit</button>
        </form>

        <h2>Store products</h2>
        <div id="products-list"></div>
    </main>
    <script src="../main.js"></script>
    <script src="product-service.js"></script>
    <script src="products.js"></script>
</body>
</html>
